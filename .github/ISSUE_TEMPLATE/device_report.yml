name: Device report (another Razer keyboard)
description: Help add support for another Razer keyboard with a Command Dial or macro keys
labels: [device-support]
body:
  - type: markdown
    attributes:
      value: |
        Run the **read-only** enumeration first: `probes/01-enumerate.sh`. It sends nothing to the keyboard.
        Please don't run driver-mode sessions on an unsupported model until a maintainer has looked at the enumeration.
  - type: input
    id: model
    attributes:
      label: Keyboard model
      placeholder: "BlackWidow V4 Pro 75%"
    validations:
      required: true
  - type: input
    id: usbid
    attributes:
      label: USB ID (from lsusb)
      placeholder: "1532:xxxx"
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: probes/out/<timestamp>-enumerate/summary.txt
      render: text
    validations:
      required: true
  - type: textarea
    id: rdesc
    attributes:
      label: Report descriptors
      description: Attach the `if*.rdesc.txt` files from the same directory (drag and drop).
  - type: textarea
    id: notes
    attributes:
      label: Anything else
      description: Wired or wireless, firmware version, whether OpenRazer supports it.
