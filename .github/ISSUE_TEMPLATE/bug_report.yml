name: Bug report
description: Something in bwv4d does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. If the keyboard is stuck in driver mode (media keys dead), run `bwv4d --restore` or replug it.
        **Never paste raw `hid-recorder` or `evtest` output that contains your typing.** Security issues go to SECURITY.md, not here.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Output of `journalctl --user -u bwv4d -b --no-pager | tail -50`
      render: text
  - type: input
    id: version
    attributes:
      label: bwv4d commit or version
      placeholder: "git rev-parse --short HEAD"
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Distribution, desktop, kernel
      placeholder: "Ubuntu 24.04, GNOME 46 on X11, 7.0.0-38"
    validations:
      required: true
  - type: input
    id: firmware
    attributes:
      label: Keyboard firmware (optional)
      description: "`sudo probes/tools/razerctl.py fw-version` with the service stopped"
